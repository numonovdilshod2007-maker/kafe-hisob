<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kafe hisobi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface-1: #f1efe8;
    --text-primary: #1c1c1a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --border: #e3e1d8;
    --accent: #0f6e56;
    --accent-bg: #e1f5ee;
    --danger: #a32d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 1.25rem; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.25rem;
  }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .type-toggle button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
  }
  .type-toggle button.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: var(--surface);
    color: var(--text-primary);
  }
  input:focus { outline: none; border-color: var(--accent); }
  button.primary {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.25rem; }
  .stat { background: var(--surface-1); border-radius: 10px; padding: 1rem; }
  .stat p:first-child { font-size: 13px; color: var(--text-secondary); margin: 0 0 4px; }
  .stat p:last-child { font-size: 22px; font-weight: 600; margin: 0; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1rem; }
  .tabs button {
    flex: 1;
    padding: 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
  }
  .tabs button.active { background: var(--surface-1); color: var(--text-primary); font-weight: 600; }
  .day-group { margin-bottom: 1.25rem; }
  .day-header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .row-left { display: flex; align-items: center; gap: 8px; }
  .row-left i { font-size: 16px; color: var(--text-secondary); }
  .row-left p { margin: 0; font-size: 15px; }
  .row-right { display: flex; align-items: center; gap: 10px; }
  .amount { font-size: 14px; font-weight: 600; }
  .amount.pay { color: var(--accent); }
  .del-btn { border: none; background: none; padding: 4px; cursor: pointer; color: var(--text-muted); font-size: 16px; }
  .empty { color: var(--text-muted); text-align: center; padding: 2rem 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kafe hisobi</h1>

  <div class="card">
    <div class="type-toggle">
      <button id="type-item" class="active">Narsa berdim</button>
      <button id="type-pay">Pul oldim</button>
    </div>
    <input type="date" id="f-date">
    <div id="f-name-row"><input type="text" id="f-name" placeholder="Nima berildi (masalan: sola)"></div>
    <input type="number" id="f-price" placeholder="Narxi (so'm)">
    <div id="f-qty-row"><input type="number" id="f-qty" placeholder="Soni (ixtiyoriy, standart 1)"></div>
    <button class="primary" id="f-add"><i class="ti ti-plus"></i> Qo'shish</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs">
    <button id="tab-all" class="active">Hammasi</button>
    <button id="tab-today">Bugun</button>
  </div>

  <div id="list"></div>
</div>

<script>
(function(){
  const KEY = 'kafe-hisob-entries';
  let entries = JSON.parse(localStorage.getItem(KEY) || '[]');
  let view = 'all';
  let currentType = 'item';

  const fmt = n => Math.round(n).toLocaleString('ru-RU') + " so'm";
  const fmtDate = d => new Date(d).toLocaleDateString('uz-UZ', {day:'2-digit', month:'long', year:'numeric'});
  const signedTotal = e => e.type === 'pay' ? -(e.price * e.qty) : (e.price * e.qty);

  function save(){ localStorage.setItem(KEY, JSON.stringify(entries)); }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateTypeButtons(){
    document.getElementById('type-item').classList.toggle('active', currentType === 'item');
    document.getElementById('type-pay').classList.toggle('active', currentType === 'pay');
    document.getElementById('f-name-row').style.display = currentType === 'item' ? '' : 'none';
    document.getElementById('f-qty-row').style.display = currentType === 'item' ? '' : 'none';
    document.getElementById('f-price').placeholder = currentType === 'item' ? "Narxi (so'm)" : "Qancha pul oldingiz (so'm)";
  }

  function addEntry(){
    const dateEl = document.getElementById('f-date');
    const nameEl = document.getElementById('f-name');
    const priceEl = document.getElementById('f-price');
    const qtyEl = document.getElementById('f-qty');

    const date = dateEl.value || new Date().toISOString().slice(0,10);
    const name = currentType === 'item' ? nameEl.value.trim() : "To'lov";
    const price = parseFloat(priceEl.value);
    const qty = currentType === 'item' ? (parseFloat(qtyEl.value) || 1) : 1;

    if((currentType === 'item' && !name) || isNaN(price)){
      if(currentType === 'item') nameEl.style.borderColor = 'var(--danger)';
      priceEl.style.borderColor = 'var(--danger)';
      return;
    }
    nameEl.style.borderColor = '';
    priceEl.style.borderColor = '';

    entries.unshift({ id: Date.now().toString(36), date, name, price, qty, type: currentType });

    nameEl.value = '';
    priceEl.value = '';
    qtyEl.value = '';

    save();
    render();
  }

  function removeEntry(id){
    entries = entries.filter(e => e.id !== id);
    save();
    render();
  }

  function render(){
    const statsEl = document.getElementById('stats');
    const listEl = document.getElementById('list');

    const balance = entries.reduce((s,e) => s + signedTotal(e), 0);
    const thisMonth = new Date().toISOString().slice(0,7);
    const monthNet = entries.filter(e => e.date.slice(0,7) === thisMonth).reduce((s,e) => s + signedTotal(e), 0);

    statsEl.innerHTML = `
      <div class="stat"><p>Kafe sizga qarzdor</p><p>${fmt(balance)}</p></div>
      <div class="stat"><p>Shu oy o'zgarish</p><p>${fmt(monthNet)}</p></div>
    `;

    document.getElementById('tab-all').classList.toggle('active', view === 'all');
    document.getElementById('tab-today').classList.toggle('active', view === 'today');

    const today = new Date().toISOString().slice(0,10);
    const shown = view === 'today' ? entries.filter(e => e.date === today) : entries;

    if(shown.length === 0){
      listEl.innerHTML = `<p class="empty">${view === 'today' ? "Bugun hali yozuv yo'q." : "Hali yozuv yo'q. Yuqoridagi formadan qo'shing."}</p>`;
      return;
    }

    const groups = {};
    shown.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
    const dates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

    listEl.innerHTML = dates.map(date => {
      const items = groups[date];
      const dayNet = items.reduce((s,e) => s + signedTotal(e), 0);
      const rows = items.map(e => {
        const isPay = e.type === 'pay';
        return `
          <div class="row">
            <div class="row-left">
              <i class="ti ${isPay ? 'ti-cash' : 'ti-package'}"></i>
              <p>${isPay ? "To'lov olindi" : escapeHtml(e.name)}${!isPay && e.qty > 1 ? ` <span style="color:var(--text-secondary)">x${e.qty}</span>` : ''}</p>
            </div>
            <div class="row-right">
              <span class="amount ${isPay ? 'pay' : ''}">${isPay ? '-' : ''}${fmt(e.price*e.qty)}</span>
              <button class="del-btn" data-id="${e.id}" aria-label="O'chirish"><i class="ti ti-trash"></i></button>
            </div>
          </div>`;
      }).join('');
      return `
        <div class="day-group">
          <div class="day-header"><span>${fmtDate(date)}</span><span>${fmt(dayNet)}</span></div>
          ${rows}
        </div>`;
    }).join('');

    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => removeEntry(btn.dataset.id));
    });
  }

  document.getElementById('f-add').addEventListener('click', addEntry);
  document.getElementById('f-date').valueAsDate = new Date();
  document.getElementById('tab-all').addEventListener('click', () => { view = 'all'; render(); });
  document.getElementById('tab-today').addEventListener('click', () => { view = 'today'; render(); });
  document.getElementById('type-item').addEventListener('click', () => { currentType = 'item'; updateTypeButtons(); });
  document.getElementById('type-pay').addEventListener('click', () => { currentType = 'pay'; updateTypeButtons(); });

  updateTypeButtons();
  render();
})();
</script>
</body>
</html>
