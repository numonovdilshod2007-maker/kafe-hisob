<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kafe hisobi</title>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --surface-1: #f1efe8;
      --text-primary: #1c1c1a;
      --text-secondary: #5f5e5a;
      --text-muted: #888780;
      --border: #e3e1d8;
      --accent: #0f6e56;
      --accent-bg: #e1f5ee;
      --danger: #a32d2d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.25rem;
    }

    .type-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .type-toggle button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
    }

    .type-toggle button.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      background: var(--surface);
      color: var(--text-primary);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
    }

    button.primary {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary:active {
      opacity: 0.85;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    .stat {
      background: var(--surface-1);
      border-radius: 10px;
      padding: 1rem;
    }

    .stat p:first-child {
      font-size: 13px;
      color: var(--text-secondary);
      margin: 0 0 4px;
    }

    .stat p:last-child {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .tabs button {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 14px;
    }

    .tabs button.active {
      background: var(--surface-1);
      color: var(--text-primary);
      font-weight: 600;
    }

    .day-group {
      margin-bottom: 1.25rem;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .row-left i {
      font-size: 16px;
      color: var(--text-secondary);
    }

    .row-left p {
      margin: 0;
      font-size: 15px;
    }

    .row-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .amount {
      font-size: 14px;
      font-weight: 600;
    }

    .amount.pay {
      color: var(--accent);
    }

    .del-btn {
      border: none;
      background: none;
      padding: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
    }

    .empty {
      color: var(--text-muted);
      text-align: center;
      padding: 2rem 0;
      font-size: 14px;
    }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-1);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
    }

    .chip:active {
      background: var(--accent-bg);
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Kafe hisobi</h1>

    <div id="login-screen" style="text-align:center; padding:3rem 1rem;">
      <p style="color:var(--text-secondary); margin-bottom:1.5rem;">Davom etish uchun Google akkountingiz bilan kiring.
      </p>
      <button class="primary" id="google-signin" style="max-width:280px; margin:0 auto;">
        <i class="ti ti-brand-google"></i> Google bilan kirish
      </button>
    </div>

    <div id="app-screen" style="display:none;">
      <div style="display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-bottom:1rem;">
        <span id="user-email" style="font-size:13px; color:var(--text-secondary);"></span>
        <button id="signout-btn"
          style="border:none; background:none; color:var(--text-muted); font-size:13px; cursor:pointer; text-decoration:underline;">Chiqish</button>
      </div>

      <div class="card">
        <div class="type-toggle">
          <button id="type-item" class="active">Narsa berdim</button>
          <button id="type-pay">Pul oldim</button>
        </div>
        <input type="date" id="f-date">
        <div id="f-name-row">
          <input type="text" id="f-name" placeholder="Nima berildi (masalan: sola)">
          <div id="quick-items" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;"></div>
        </div>
        <input type="number" id="f-price" placeholder="Narxi (so'm)">
        <div id="f-qty-row"><input type="number" id="f-qty" placeholder="Soni (ixtiyoriy, standart 1)"></div>
        <button class="primary" id="f-add"><i class="ti ti-plus"></i> Qo'shish</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="tabs">
        <button id="tab-all" class="active">Hammasi</button>
        <button id="tab-today">Bugun</button>
      </div>

      <div id="list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    // ==== 1. Bu yerga o'zingizning Firebase konfiguratsiyangizni qo'ying ====
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    // ==========================================================================

    (function () {
      let entries = [];
      let view = 'all';
      let currentType = 'item';
      let uid = null;
      let unsubscribe = null;

      const fmt = n => Math.round(n).toLocaleString('ru-RU') + " so'm";
      const fmtDate = d => new Date(d).toLocaleDateString('uz-UZ', { day: '2-digit', month: 'long', year: 'numeric' });
      const signedTotal = e => e.type === 'pay' ? -(e.price * e.qty) : (e.price * e.qty);

      function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }

      // ---- Auth ----
      document.getElementById('google-signin').addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => alert("Kirishda xatolik: " + err.message));
      });

      document.getElementById('signout-btn').addEventListener('click', () => {
        auth.signOut();
      });

      auth.onAuthStateChanged(user => {
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        if (user) {
          uid = user.uid;
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';
          document.getElementById('user-email').textContent = user.email || '';
          listenToEntries();
        } else {
          uid = null;
          entries = [];
          document.getElementById('login-screen').style.display = 'block';
          document.getElementById('app-screen').style.display = 'none';
        }
      });

      // ---- Firestore ----
      function listenToEntries() {
        unsubscribe = db.collection('users').doc(uid).collection('entries')
          .orderBy('createdAt', 'desc')
          .onSnapshot(snap => {
            entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          }, err => {
            console.error(err);
          });
      }

      function addEntryToDb(entry) {
        return db.collection('users').doc(uid).collection('entries').add({
          ...entry,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      function removeEntryFromDb(id) {
        return db.collection('users').doc(uid).collection('entries').doc(id).delete();
      }

      // ---- UI logic ----
      function updateTypeButtons() {
        document.getElementById('type-item').classList.toggle('active', currentType === 'item');
        document.getElementById('type-pay').classList.toggle('active', currentType === 'pay');
        document.getElementById('f-name-row').style.display = currentType === 'item' ? '' : 'none';
        document.getElementById('f-qty-row').style.display = currentType === 'item' ? '' : 'none';
        document.getElementById('f-price').placeholder = currentType === 'item' ? "Narxi (so'm)" : "Qancha pul oldingiz (so'm)";
      }

      function addEntry() {
        const dateEl = document.getElementById('f-date');
        const nameEl = document.getElementById('f-name');
        const priceEl = document.getElementById('f-price');
        const qtyEl = document.getElementById('f-qty');

        const date = dateEl.value || new Date().toISOString().slice(0, 10);
        const name = currentType === 'item' ? nameEl.value.trim() : "To'lov";
        const price = parseFloat(priceEl.value);
        const qty = currentType === 'item' ? (parseFloat(qtyEl.value) || 1) : 1;

        if ((currentType === 'item' && !name) || isNaN(price)) {
          if (currentType === 'item') nameEl.style.borderColor = 'var(--danger)';
          priceEl.style.borderColor = 'var(--danger)';
          return;
        }
        nameEl.style.borderColor = '';
        priceEl.style.borderColor = '';

        addEntryToDb({ date, name, price, qty, type: currentType });

        nameEl.value = '';
        priceEl.value = '';
        qtyEl.value = '';
      }

      function removeEntry(id) {
        removeEntryFromDb(id);
      }

      function render() {
        renderQuickItems();
        const statsEl = document.getElementById('stats');
        const listEl = document.getElementById('list');

        const balance = entries.reduce((s, e) => s + signedTotal(e), 0);
        const thisMonth = new Date().toISOString().slice(0, 7);
        const monthNet = entries.filter(e => e.date.slice(0, 7) === thisMonth).reduce((s, e) => s + signedTotal(e), 0);

        statsEl.innerHTML = `
      <div class="stat"><p>Kafe sizga qarzdor</p><p>${fmt(balance)}</p></div>
      <div class="stat"><p>Shu oy o'zgarish</p><p>${fmt(monthNet)}</p></div>
    `;

        document.getElementById('tab-all').classList.toggle('active', view === 'all');
        document.getElementById('tab-today').classList.toggle('active', view === 'today');

        const today = new Date().toISOString().slice(0, 10);
        const shown = view === 'today' ? entries.filter(e => e.date === today) : entries;

        if (shown.length === 0) {
          listEl.innerHTML = `<p class="empty">${view === 'today' ? "Bugun hali yozuv yo'q." : "Hali yozuv yo'q. Yuqoridagi formadan qo'shing."}</p>`;
          return;
        }

        const groups = {};
        shown.forEach(e => { (groups[e.date] = groups[e.date] || []).push(e); });
        const dates = Object.keys(groups).sort((a, b) => b.localeCompare(a));

        listEl.innerHTML = dates.map(date => {
          const items = groups[date];
          const dayNet = items.reduce((s, e) => s + signedTotal(e), 0);
          const rows = items.map(e => {
            const isPay = e.type === 'pay';
            return `
          <div class="row">
            <div class="row-left">
              <i class="ti ${isPay ? 'ti-cash' : 'ti-package'}"></i>
              <p>${isPay ? "To'lov olindi" : escapeHtml(e.name)}${!isPay && e.qty > 1 ? ` <span style="color:var(--text-secondary)">x${e.qty}</span>` : ''}</p>
            </div>
            <div class="row-right">
              <span class="amount ${isPay ? 'pay' : ''}">${isPay ? '-' : ''}${fmt(e.price * e.qty)}</span>
              <button class="del-btn" data-id="${e.id}" aria-label="O'chirish"><i class="ti ti-trash"></i></button>
            </div>
          </div>`;
          }).join('');
          return `
        <div class="day-group">
          <div class="day-header"><span>${fmtDate(date)}</span><span>${fmt(dayNet)}</span></div>
          ${rows}
        </div>`;
        }).join('');

        listEl.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', () => removeEntry(btn.dataset.id));
        });
      }

      function renderQuickItems() {
        const container = document.getElementById('quick-items');
        const seen = new Map();
        entries.filter(e => e.type === 'item').forEach(e => {
          if (!seen.has(e.name)) seen.set(e.name, e.price);
        });
        const names = Array.from(seen.keys()).slice(0, 12);
        if (names.length === 0) { container.innerHTML = ''; return; }
        container.innerHTML = names.map(n => `<button type="button" class="chip" data-name="${escapeHtml(n)}" data-price="${seen.get(n)}">${escapeHtml(n)}</button>`).join('');
        container.querySelectorAll('.chip').forEach(btn => {
          btn.addEventListener('click', () => {
            document.getElementById('f-name').value = btn.dataset.name;
            document.getElementById('f-price').value = btn.dataset.price;
            document.getElementById('f-qty').focus();
          });
        });
      }

      document.getElementById('f-add').addEventListener('click', addEntry);
      document.getElementById('f-date').valueAsDate = new Date();
      document.getElementById('tab-all').addEventListener('click', () => { view = 'all'; render(); });
      document.getElementById('tab-today').addEventListener('click', () => { view = 'today'; render(); });
      document.getElementById('type-item').addEventListener('click', () => { currentType = 'item'; updateTypeButtons(); });
      document.getElementById('type-pay').addEventListener('click', () => { currentType = 'pay'; updateTypeButtons(); });

      updateTypeButtons();
    })();
  </script>
</body>

</html>
